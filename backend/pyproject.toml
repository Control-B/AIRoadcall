[project]
name = "ai-roadcall-backend"
version = "0.1.0"
description = "FastAPI backend for AI-powered roadside assistance dispatch"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    "stripe==11.4.1",
    "httpx==0.28.1",
    "aiosqlite>=0.20",
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    "python-multipart==0.0.20",
    "tenacity==9.0.0",
    "twilio>=9.0.0",
    "telnyx>=2.0.0",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
