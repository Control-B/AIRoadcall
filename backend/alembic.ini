[alembic]
script_location = alembic
# URL is set from DATABASE_URL env var in alembic/env.py
# This fallback is only used if env var is missing
sqlalchemy.url = postgresql+asyncpg://airoadcall:airoadcall@localhost:5432/airoadcall

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
