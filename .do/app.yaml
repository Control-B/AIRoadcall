# DigitalOcean App Platform Spec
# https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Deploy:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <app-id> --spec .do/app.yaml
# Or connect the repo in the DO dashboard and it auto-deploys on push.

name: airoadcall

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: backend
    - match:
        path:
          prefix: /health
      component:
        name: backend
    - match:
        path:
          prefix: /
      component:
        name: frontend

services:
  # ── FastAPI Backend ─────────────────────────────────────
  - name: backend
    github:
      repo: Control-B/AIRoadcall
      branch: main
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 30
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: LIVEKIT_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: LIVEKIT_API_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: LIVEKIT_URL
        scope: RUN_TIME
        type: SECRET
      - key: LIVEKIT_SIP_TRUNK_ID
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_ACCOUNT_SID
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_FROM_NUMBER
        scope: RUN_TIME
        type: SECRET
      - key: APIFY_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TAVILY_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: MAGIC_LINK_SECRET
        scope: RUN_TIME
        type: SECRET

  # ── Next.js Frontend ────────────────────────────────────
  - name: frontend
    github:
      repo: Control-B/AIRoadcall
      branch: main
      deploy_on_push: true
    dockerfile_path: frontend/Dockerfile
    source_dir: frontend
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 30
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}/api
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        scope: BUILD_TIME
        type: SECRET
      - key: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
        scope: BUILD_TIME
        type: SECRET

# ── DigitalOcean Managed Database ───────────────────────
databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
