# DigitalOcean App Platform Spec
# https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Deploy:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <app-id> --spec .do/app.yaml
# Or connect the repo in the DO dashboard and it auto-deploys on push.

name: airoadcall

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /health
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: frontend

services:
  # ── FastAPI Backend ─────────────────────────────────────
  - name: backend
    github:
      repo: Control-B/AIRoadcall
      branch: main
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 30
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: LIVEKIT_API_KEY
        scope: RUN_TIME
        value: API4TxLvaSLjdLm
      - key: LIVEKIT_API_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: LIVEKIT_URL
        scope: RUN_TIME
        value: wss://roadcall-vob5sadf.livekit.cloud
      - key: LIVEKIT_SIP_TRUNK_ID
        scope: RUN_TIME
        value: ST_6X5DkFGsA5at
      - key: LIVEKIT_AGENT_NAME
        scope: RUN_TIME
        value: roadcall-agent
      - key: TWILIO_ACCOUNT_SID
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_FROM_NUMBER
        scope: RUN_TIME
        value: "+18134524889"
      - key: RETELL_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: APIFY_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TAVILY_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: APP_BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: DEMO_AUTO_ASSIGN_NEAREST_MECHANIC
        scope: RUN_TIME
        value: "true"
      - key: DEMO_SKIP_PAYMENT_AUTHORIZATION
        scope: RUN_TIME
        value: "true"
      - key: JOB_DUPLICATE_WINDOW_MINUTES
        scope: RUN_TIME
        value: "15"
      - key: MAGIC_LINK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_USERNAME
        scope: RUN_TIME
        value: admin@omniweb.ai
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: RESEND_FROM_EMAIL
        scope: RUN_TIME
        value: onboarding@resend.dev
      - key: DEMO_PHONE_NUMBER
        scope: RUN_TIME
        value: "+18666133303"
      - key: DO_AI_ENDPOINT
        scope: RUN_TIME
        value: https://cluster-api.do-ai.run/v1
      - key: DO_AI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DO_AI_MODEL
        scope: RUN_TIME
        value: meta-llama/Meta-Llama-3.1-70B-Instruct

  # ── Next.js Frontend ────────────────────────────────────
  - name: frontend
    github:
      repo: Control-B/AIRoadcall
      branch: main
      deploy_on_push: true
    dockerfile_path: frontend/Dockerfile
    source_dir: frontend
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 30
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}/api
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        scope: BUILD_TIME
        value: REPLACE_WITH_STRIPE_PUBLISHABLE_KEY
      - key: MAPBOX_ACCESS_TOKEN
        scope: BUILD_TIME
        value: REPLACE_WITH_MAPBOX_ACCESS_TOKEN
      - key: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
        scope: BUILD_TIME
        value: REPLACE_WITH_MAPBOX_ACCESS_TOKEN
      - key: NEXT_PUBLIC_HELP_PHONE
        scope: BUILD_TIME
        value: "(866) 623-3331"
      - key: NEXT_PUBLIC_COMPANY_PHONE
        scope: BUILD_TIME
        value: "(866) 415-9494"

# ── DigitalOcean Managed Database (existing cluster) ────
databases:
  - name: db
    engine: PG
    cluster_name: app-fe477b43-c0cc-486c-9c32-1c4122fc4553
    db_name: defaultdb
    db_user: doadmin
    production: true
