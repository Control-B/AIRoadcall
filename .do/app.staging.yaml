# Staging / test DigitalOcean App Platform spec
# Create: doctl apps create --spec .do/app.staging.yaml --format ID,DefaultIngress
# Update: doctl apps update <app-id> --spec .do/app.staging.yaml
# Notes:
# - Uses the existing managed Postgres cluster, but a separate database: `airoadcall_staging`
# - Removes production custom domains
# - Disables deploy-on-push so staging deployments stay manual until a staging branch exists

databases:
- cluster_name: app-fe477b43-c0cc-486c-9c32-1c4122fc4553
  db_name: airoadcall_staging
  db_user: doadmin
  engine: PG
  name: db
  production: true
ingress:
  rules:
  - component:
      name: backend
      preserve_path_prefix: true
    match:
      path:
        prefix: /api
  - component:
      name: backend
      preserve_path_prefix: true
    match:
      path:
        prefix: /health
  - component:
      name: frontend
    match:
      path:
        prefix: /
name: airoadcall-staging
region: nyc
services:
- dockerfile_path: backend/Dockerfile
  envs:
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db.DATABASE_URL}
