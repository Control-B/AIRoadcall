# render.yaml — Render Blueprint for AI Roadside Support
# https://docs.render.com/blueprint-spec

databases:
  - name: airoadcall-db
    plan: free
    databaseName: airoadcall
    user: airoadcall

services:
  # ── FastAPI Backend ─────────────────────────────────────
  - type: web
    name: airoadcall-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: airoadcall-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_SIP_TRUNK_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://airoadcall-frontend.onrender.com

  # ── Next.js Frontend ────────────────────────────────────
  - type: web
    name: airoadcall-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder" npx prisma generate && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://airoadcall-backend.onrender.com/api
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
        sync: false
