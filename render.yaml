# render.yaml — Render Blueprint for AI Roadside Support
# https://docs.render.com/blueprint-spec

# Database: DigitalOcean Managed PostgreSQL (external)
# Set DATABASE_URL env var on each service to your DO connection string

services:
  # ── FastAPI Backend ─────────────────────────────────────
  # Docker build: avoids “Dockerfile not found” when the dashboard expects a repo-root Dockerfile.
  # Paths are relative to the repo root (monorepo layout).
  - type: web
    name: airoadcall-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # Set to your DigitalOcean PostgreSQL connection string
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_SIP_TRUNK_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://airoadcall-frontend.onrender.com

  # ── Next.js Frontend ────────────────────────────────────
  - type: web
    name: airoadcall-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://airoadcall-backend.onrender.com/api
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
        sync: false
